name: LaTeX compiler

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: write

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    name: "Spellcheck"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade codespell
      - name: Run spellcheck
        run: |
          codespell $(git ls-files '*.tex')

  build:
    runs-on: ubuntu-latest
    name: "Compile document"
    permissions:
      actions: write
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install TeX Live
        run: |
          sudo apt update
          sudo apt install -y biber texlive-base texlive-latex-recommended texlive-latex-extra texlive-science
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install more packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: |
            latexmk

      - name: Compile document
        run: |
          latexmk -pdflatex -interaction=nonstopmode -file-line-error main.tex
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          path: main.pdf
          name: main.pdf

  release:
    runs-on: ubuntu-latest
    name: "Create GitHub Release"
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: main.pdf

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "Release ${{ steps.version.outputs.VERSION }}"
          body: |
            ## 📖 Programmable Cryptography: Four Easy Pieces

            Release ${{ steps.version.outputs.VERSION }} of the Four Easy Pieces textbook.

            Generated from commit: ${{ github.sha }}
          files: main.pdf
          draft: false
          prerelease: false
